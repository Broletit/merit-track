name: Build complete Chapter 3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-chapter3-complete.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thesis-analysis-design

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx matplotlib

      - name: Generate Chapter 3 and XMI
        run: |
          python thesis/build_chapter3_complete.py

      - name: Upload generated Chapter 3 package
        uses: actions/upload-artifact@v4
        with:
          name: MeritTrack-Chapter3-Complete
          path: thesis/generated_chapter3/**
          include-hidden-files: true
          compression-level: 6
          if-no-files-found: error

      - name: Upload Visual Paradigm XMI package
        uses: actions/upload-artifact@v4
        with:
          name: MeritTrack-VisualParadigm-XMI
          path: thesis/generated_chapter3/visual-paradigm/**
          include-hidden-files: true
          compression-level: 6
          if-no-files-found: error

